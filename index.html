<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carburant">
<meta name="theme-color" content="#14231f">
<title>Total : le carburant le moins cher</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#14231f;--muted:#5d6b66;--line:#dfe5e2;--bg:#f5f7f6;--best:#0b8f5e;--sel:#ffb703}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.35 -apple-system,system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#top{flex:1 1 45%;min-height:200px;position:relative}
#map{position:absolute;inset:0}
#refresh{position:absolute;top:10px;right:10px;z-index:1000;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font:600 15px system-ui;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#sheet{flex:0 1 auto;max-height:55%;overflow:auto;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;position:sticky;top:0;background:#fff;z-index:2}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font:inherit;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
#status{padding:10px 12px;color:var(--muted)}
#detail{padding:4px 12px 12px}
#detail h2{font-size:18px;margin:4px 0 2px}
#detail p{margin:2px 0;color:var(--muted)}
#detail .big{color:var(--ink);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
#detail .tag{color:var(--best);font-weight:700}
.go{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;text-align:center;text-decoration:none;background:var(--ink);color:#fff;padding:16px 12px;border-radius:12px;font-weight:600}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line);flex:.6}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;border:0;border-top:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left}
.row[aria-current=true]{background:#eef6f2}
.row .price{font-weight:700;font-variant-numeric:tabular-nums;min-width:70px}
.row.best .price{color:var(--best)}
.row .who{flex:1;min-width:0}
.row .who span{display:block;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .km{color:var(--muted);font-variant-numeric:tabular-nums}
.pin{background:#fff;border:2px solid var(--ink);border-radius:8px;font:700 13px system-ui;text-align:center;line-height:20px;white-space:nowrap}
.pin.best{background:var(--best);border-color:var(--best);color:#fff}
.pin.sel{box-shadow:0 0 0 3px var(--sel)}
</style>
</head>
<body>
<div id="top"><div id="map"></div><button id="refresh">Actualiser (v10)</button></div>
<div id="sheet">
  <div class="chips" id="chips"></div>
  <div id="status"></div>
  <div id="detail"></div>
  <div id="list"></div>
  <details style="padding:10px 12px"><summary>Détails techniques (v10)</summary><pre id="log" style="white-space:pre-wrap;font-size:12px;margin:8px 0 0"></pre></details>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FUELS = [["gazole","Gazole"],["e10","SP95-E10"],["sp95","SP95"],["sp98","SP98"],["e85","E85"],["gplc","GPLc"]];
const GOV = "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/prix-des-carburants-en-france-flux-instantane-v2/records";
const OVERPASS = [
  "https://overpass.openstreetmap.fr/api/interpreter",
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
  "https://overpass.private.coffee/api/interpreter"
];
const CK = "osmcache3";

let fuel = "gazole";
try { fuel = localStorage.getItem("fuel") || fuel; } catch (e) {}
let me, meMarker, searchPos, searchT = 0, busy = false;
let stations = [], ordered = [], sel = null, map, layer, fitted = false;

function km(a, b) {
  const r = Math.PI / 180, dl = (b.lat - a.lat) * r, dn = (b.lon - a.lon) * r;
  const h = Math.sin(dl / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dn / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}
const price = s => { const v = s.g && s.g[fuel + "_prix"]; return v == null ? null : Number(v); };
const fmt = p => p.toFixed(3).replace(".", ",") + " €";
function age(s) {
  const d = s.g && s.g[fuel + "_maj"];
  if (!d) return "";
  const h = (Date.now() - new Date(d)) / 36e5;
  return "Prix mis à jour il y a " + (h < 48 ? Math.max(1, Math.round(h)) + " h" : Math.round(h / 24) + " jours");
}
const logLines = [], tStart = Date.now();
function dbg(m) {
  logLines.push(((Date.now() - tStart) / 1000).toFixed(1) + " s  " + m);
  const el = $("#log");
  if (el) el.textContent = logLines.join("\n");
}
let base = "", t0 = 0;
const paint = () => {
  const el = $("#status");
  el.textContent = base && busy ? base + " " + Math.round((Date.now() - t0) / 1000) + " s" : base;
  el.style.display = base ? "block" : "none";
};
const status = m => { base = m; t0 = Date.now(); paint(); };
setInterval(() => { if (busy) paint(); }, 1000);

function renderChips() {
  $("#chips").innerHTML = FUELS.map(([k, n]) =>
    `<button class="chip" data-k="${k}" aria-pressed="${k === fuel}">${n}</button>`).join("");
}
$("#chips").addEventListener("click", e => {
  const k = e.target.dataset.k;
  if (!k) return;
  fuel = k;
  try { localStorage.setItem("fuel", k); } catch (e) {}
  renderChips();
  sel = null;
  render();
});

/* ---------- Stations (OpenStreetMap) avec cache sur le téléphone ---------- */
async function overpass(q) {
  // Les 3 serveurs sont interrogés en même temps : le plus rapide gagne.
  const tries = OVERPASS.map(async url => {
    const host = new URL(url).host;
    const ac = new AbortController();
    const t1 = Date.now();
    const t = setTimeout(() => ac.abort(), 60000);
    try {
      const r = await fetch(url, { method: "POST", body: "data=" + encodeURIComponent(q), signal: ac.signal });
      if (!r.ok) throw new Error(host + " : erreur " + r.status);
      const j = await r.json();
      if (j.remark && !(j.elements || []).length) throw new Error(host + " : " + j.remark);
      dbg(host + " : réponse OK, " + (j.elements || []).length + " éléments en " + ((Date.now() - t1) / 1000).toFixed(1) + " s");
      return j;
    } catch (e) {
      const err = new Error(e.name === "AbortError" ? host + " : trop lent" : (e.message.startsWith(host) ? e.message : host + " : " + e.message));
      dbg(err.message + " (" + ((Date.now() - t1) / 1000).toFixed(1) + " s)");
      throw err;
    } finally {
      clearTimeout(t);
    }
  });
  try {
    return await Promise.any(tries);
  } catch (agg) {
    throw new Error((agg.errors || []).map(e => e.message).join(" ; "));
  }
}
const loadCache = () => { try { return JSON.parse(localStorage.getItem(CK)) || []; } catch (e) { return []; } };
const saveCache = c => { try { localStorage.setItem(CK, JSON.stringify(c.slice(0, 8))); } catch (e) {} };

// Renvoie les 10 plus proches si la zone mémorisée suffit, sinon null.
function fromCache(c) {
  if (Date.now() - c.t > 30 * 864e5) return null;
  const off = km(c, me);
  const items = c.items.map(p => ({ ...p, d: km(me, p) })).sort((a, b) => a.d - b.d).slice(0, 10);
  if (!items.length) return null;
  const ok = items.length >= 10 ? items[9].d <= c.R - off : off < 5;
  return ok ? items : null;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

function parseOverpass(els) {
  const items = [];
  for (const el of els) {
    const p = { lat: el.lat ?? el.center?.lat, lon: el.lon ?? el.center?.lon };
    if (p.lat == null || items.some(o => km(o, p) < 0.06)) continue;
    p.name = el.tags.name || "TotalEnergies";
    p.addr = [el.tags["addr:housenumber"], el.tags["addr:street"], el.tags["addr:city"]].filter(Boolean).join(" ");
    p.id = el.type + el.id;
    items.push(p);
  }
  return items;
}

// Solution de secours : recherche par nom (Nominatim), rapide mais moins complète.
async function nominatim() {
  const d = 0.3, vb = [me.lon - d, me.lat + d, me.lon + d, me.lat - d].join(",");
  const items = [];
  let lastErr = "";
  // Plusieurs noms : « Total », « TotalEnergies » et « Total Access » ne sont pas trouvés par la même recherche.
  for (const q of ["Total", "TotalEnergies", "Total Access"]) {
    try {
      const r = await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=40&bounded=1&q=" + encodeURIComponent(q) + "&viewbox=" + vb);
      if (!r.ok) throw new Error("erreur " + r.status);
      for (const x of await r.json()) {
        if (x.type !== "fuel") continue;
        const p = { lat: +x.lat, lon: +x.lon };
        if (items.some(o => km(o, p) < 0.06)) continue;
        p.name = x.name || "TotalEnergies";
        p.addr = (x.display_name || "").split(",").slice(0, 3).join(",");
        p.id = "n" + x.place_id;
        items.push(p);
      }
    } catch (e) { lastErr = e.message; }
    await sleep(1100);
  }
  if (!items.length) throw new Error("nominatim : " + (lastErr || "aucun résultat"));
  return items;
}

let lastSrc = "overpass", skipCache = false;

async function fetchOsm(onPartial) {
  const cache = loadCache();
  for (const c of (skipCache ? [] : cache)) { const r = fromCache(c); if (r) { lastSrc = "cache"; dbg("Liste mémorisée utilisée : " + r.length + " station(s)"); return r; } }
  skipCache = false;
  let ok = false, partial = null, nomErr = "";
  // Recherche de secours : lancée après 5 s seulement si la recherche complète n’a pas répondu.
  const nomP = (async () => {
    await sleep(5000);
    if (ok) return;
    try {
      partial = await nominatim();
      dbg("Nominatim : " + partial.length + " station(s)");
      if (!ok) onPartial(partial.map(p => ({ ...p })));
    } catch (e) { nomErr = e.message; dbg("Nominatim : " + e.message); }
  })();
  let res;
  try {
    let items = [], R = 0;
    for (R of [20, 50]) {
      const a = `(around:${R * 1000},${me.lat},${me.lon})`;
      const q = `[out:json][timeout:25];(nwr["amenity"="fuel"]["brand"~"Total",i]${a};nwr["amenity"="fuel"]["name"~"Total",i]${a};);out center tags;`;
      items = parseOverpass((await overpass(q)).elements);
      dbg("Overpass (rayon " + R + " km) : " + items.length + " station(s)");
      if (items.length >= 10) break;
    }
    if (!items.length) throw new Error("overpass : aucune station");
    res = { items, R };
  } catch (e) {
    await nomP;
    if (partial) {
      lastSrc = "nominatim";
      return partial.map(p => ({ ...p, d: km(me, p) })).sort((a, b) => a.d - b.d).slice(0, 10);
    }
    throw new Error(e.message + (nomErr ? " ; " + nomErr : ""));
  }
  ok = true;
  lastSrc = "overpass";
  const entry = { lat: me.lat, lon: me.lon, R: res.R, t: Date.now(), items: res.items };
  saveCache([entry, ...cache]);
  return fromCache(entry) || [];
}

/* ---------- Prix (données officielles) ---------- */
async function fetchGov(list) {
  const where = list.map(s => `within_distance(geom, geom'POINT(${s.lon} ${s.lat})', 300m)`).join(" OR ");
  const u = new URL(GOV);
  u.searchParams.set("where", where);
  u.searchParams.set("limit", "100");
  const r = await fetch(u);
  if (!r.ok) throw new Error("Prix " + r.status);
  return (await r.json()).results || [];
}

// Les coordonnées officielles sont arrondies (environ 100 m) : on compare aussi les adresses.
const SKIP = ["avenue", "boulevard", "route", "chemin", "place", "quai", "impasse", "zone", "centre", "nationale", "departementale"];
const words = t => new Set((t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
  .split(/[^a-z0-9]+/).filter(w => w.length >= 4 && !SKIP.includes(w)));
const overlap = (a, b) => { const A = words(a); for (const w of words(b)) if (A.has(w)) return true; return false; };

async function attachPrices(list) {
  let gov = [], err = "";
  try { gov = await fetchGov(list); } catch (e) { err = e.message; }
  for (const s of list) {
    let best = null, bd = 9;
    for (const g of gov) {
      if (!g.geom) continue;
      let d = km(s, { lat: g.geom.lat, lon: g.geom.lon });
      if (d > 0.3) continue;
      if (overlap(s.addr, g.adresse)) d -= 0.25;
      if (d < bd) { bd = d; best = g; }
    }
    s.g = best;
    if (best && best.adresse) s.addr = best.adresse + ", " + (best.cp || "") + " " + (best.ville || "");
  }
  dbg("Prix : " + gov.length + " station(s) officielle(s) reçue(s), " + list.filter(s => s.g).length + " associée(s) sur " + list.length + (err ? " ; erreur " + err : ""));
  return err;
}

let again = false;
async function refresh() {
  if (!me) return;
  if (busy) { again = true; return; }
  busy = true;
  const here = { ...me };
  let final = false;
  try {
    status("Recherche des stations TotalEnergies (jusqu’à 1 min)…");
    const found = await fetchOsm(async partial => {
      const err = await attachPrices(partial);
      if (final) return;
      stations = partial; sel = null; fitted = false;
      render();
      status("Résultat partiel : la recherche complète continue" + (err ? " (prix indisponibles : " + err + ")" : "") + "…");
    });
    final = true;
    if (!found.length) { stations = []; status("Aucune station TotalEnergies trouvée près de toi."); return; }
    status("Chargement des prix…");
    const priceErr = await attachPrices(found);
    stations = found;
    searchPos = here;
    searchT = Date.now();
    if (!stations.some(s => s.id === sel)) sel = null;
    fitted = false;
    const notes = [];
    if (lastSrc === "nominatim") notes.push("Liste partielle : les serveurs de cartes n’ont pas répondu, des stations peuvent manquer.");
    if (priceErr) notes.push("Prix indisponibles (" + priceErr + ").");
    status(notes.length ? notes.join(" ") + " Touche Actualiser pour réessayer." : "");
    render();
  } catch (e) {
    final = true;
    status("Chargement impossible (" + e.message + "). Touche Actualiser pour réessayer.");
  } finally {
    busy = false;
    if (again) { again = false; refresh(); }
  }
}

/* ---------- Affichage ---------- */
function render() {
  if (!stations.length) return;
  stations.forEach(s => { s.d = km(me, s); });
  const withP = stations.filter(s => price(s) != null).sort((a, b) => price(a) - price(b));
  const noP = stations.filter(s => price(s) == null).sort((a, b) => a.d - b.d);
  ordered = [...withP, ...noP];
  const best = withP[0] || null;
  if (!sel) sel = (best || ordered[0]).id;

  layer.clearLayers();
  for (const s of ordered) {
    const p = price(s);
    L.marker([s.lat, s.lon], {
      icon: L.divIcon({ className: "", iconSize: [64, 24], iconAnchor: [32, 12],
        html: `<div class="pin${s === best ? " best" : ""}" data-id="${s.id}">${p != null ? p.toFixed(3).replace(".", ",") : "n.d."}</div>` })
    }).addTo(layer).on("click", () => select(s.id));
  }

  $("#list").innerHTML = ordered.map(s => {
    const p = price(s);
    return `<button class="row${s === best ? " best" : ""}" data-id="${s.id}">
      <div class="price">${p != null ? fmt(p) : "n.d."}</div>
      <div class="who">${esc(s.name)}<span>${esc(s.addr)}</span></div>
      <div class="km">${s.d.toFixed(1).replace(".", ",")} km</div></button>`;
  }).join("");

  if (!fitted) {
    map.fitBounds(L.latLngBounds([[me.lat, me.lon], ...stations.map(s => [s.lat, s.lon])]).pad(0.15));
    fitted = true;
  }
  select(sel, false);
}
$("#list").addEventListener("click", e => {
  const r = e.target.closest(".row");
  if (r) select(r.dataset.id);
});

function select(id, pan = true) {
  sel = id;
  const s = stations.find(x => x.id === id);
  if (!s) return;
  const best = ordered.find(x => price(x) != null);
  document.querySelectorAll(".pin").forEach(p => p.classList.toggle("sel", p.dataset.id === id));
  document.querySelectorAll(".row").forEach(r => r.toggleAttribute("aria-current", r.dataset.id === id));
  if (pan) map.panTo([s.lat, s.lon]);
  const p = price(s);
  $("#detail").innerHTML = `<h2>${esc(s.name)}</h2>
    <p>${esc(s.addr)}</p>
    <p>À environ ${s.d.toFixed(1).replace(".", ",")} km de toi (à vol d’oiseau)</p>
    ${p != null
      ? `<p class="big">${fmt(p)}/L</p>${s === best ? '<p class="tag">La moins chère des ' + stations.length + "</p>" : ""}<p>${age(s)}</p>`
      : (s.g ? "<p>Ce carburant n’est pas vendu dans cette station.</p>" : "<p>Station non retrouvée dans les prix officiels.</p>")}
    <div class="go">
      <a class="btn" href="https://maps.apple.com/?daddr=${s.lat},${s.lon}&dirflg=d">Lancer l’itinéraire</a>
      <a class="btn alt" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}&travelmode=driving">Google Maps</a>
    </div>`;
}

/* ---------- Position en continu ---------- */
let gps = null, manual = false;
function start() {
  renderChips();
  map = L.map("map", { zoomControl: false }).setView([46.6, 2.5], 6);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
  layer = L.layerGroup().addTo(map);
  status("Localisation en cours…");

  navigator.geolocation.watchPosition(p => {
    if (!gps) dbg("Position : " + p.coords.latitude.toFixed(4) + ", " + p.coords.longitude.toFixed(4) + " (précision " + Math.round(p.coords.accuracy) + " m)");
    gps = { lat: p.coords.latitude, lon: p.coords.longitude };
    if (manual) return;
    me = { ...gps };
    if (!meMarker) {
      meMarker = L.circleMarker([me.lat, me.lon], { radius: 8, color: "#fff", weight: 3, fillColor: "#2563eb", fillOpacity: 1 }).addTo(map);
      map.setView([me.lat, me.lon], 12);
    } else {
      meMarker.setLatLng([me.lat, me.lon]);
    }
    if (!searchPos || km(me, searchPos) > 3) refresh();
  }, () => {
    if (!me) status("Position indisponible. Autorise la localisation pour Safari dans Réglages > Confidentialité, puis recharge la page.");
  }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });

  // Clic droit (PC) ou appui long (téléphone) sur la carte : fixer la position à la main.
  map.on("contextmenu", e => {
    manual = true;
    me = { lat: e.latlng.lat, lon: e.latlng.lng };
    if (!meMarker) meMarker = L.circleMarker([me.lat, me.lon], { radius: 8, color: "#fff", weight: 3, fillColor: "#2563eb", fillOpacity: 1 }).addTo(map);
    meMarker.setLatLng([me.lat, me.lon]);
    refresh();
  });

  // Actualiser : revient à la position GPS et relance la recherche.
  $("#refresh").addEventListener("click", () => {
    skipCache = true;
    manual = false;
    if (gps) me = { ...gps };
    if (!me) return;
    if (meMarker) meMarker.setLatLng([me.lat, me.lon]);
    map.setView([me.lat, me.lon], 12);
    refresh();
  });
  // Au retour sur l’app (après un itinéraire, par exemple) : remettre les prix à jour si besoin.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && me && Date.now() - searchT > 10 * 60 * 1000) refresh();
  });
}
start();
</script>
</body>
</html>
