<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carburant">
<meta name="theme-color" content="#14231f">
<title>Total : le carburant le moins cher</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#14231f;--muted:#5d6b66;--line:#dfe5e2;--bg:#f5f7f6;--best:#0b8f5e;--sel:#ffb703}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.35 -apple-system,system-ui,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#map{flex:1 1 45%;min-height:200px}
#sheet{flex:0 1 auto;max-height:55%;overflow:auto;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;position:sticky;top:0;background:#fff;z-index:2}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
#status{padding:10px 12px;color:var(--muted)}
#detail{padding:4px 12px 12px}
#detail h2{font-size:18px;margin:4px 0 2px}
#detail p{margin:2px 0;color:var(--muted)}
#detail .big{color:var(--ink);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
#detail .tag{color:var(--best);font-weight:700}
.go{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;text-align:center;text-decoration:none;background:var(--ink);color:#fff;padding:12px;border-radius:10px;font-weight:600}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line);flex:.6}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:0;border-top:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left}
.row[aria-current=true]{background:#eef6f2}
.row .price{font-weight:700;font-variant-numeric:tabular-nums;min-width:70px}
.row.best .price{color:var(--best)}
.row .who{flex:1;min-width:0}
.row .who span{display:block;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .km{color:var(--muted);font-variant-numeric:tabular-nums}
.pin{background:#fff;border:2px solid var(--ink);border-radius:8px;font:700 13px system-ui;text-align:center;line-height:20px;white-space:nowrap}
.pin.best{background:var(--best);border-color:var(--best);color:#fff}
.pin.sel{box-shadow:0 0 0 3px var(--sel)}
</style>
</head>
<body>
<div id="map"></div>
<div id="sheet">
  <div class="chips" id="chips"></div>
  <div id="status"></div>
  <div id="detail"></div>
  <div id="list"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FUELS = [["gazole","Gazole"],["e10","SP95-E10"],["sp95","SP95"],["sp98","SP98"],["e85","E85"],["gplc","GPLc"]];
const GOV = "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/prix-des-carburants-en-france-flux-instantane-v2/records";

let fuel = "gazole";
try { fuel = localStorage.getItem("fuel") || fuel; } catch (e) {}
let me, stations = [], ordered = [], sel = null, map, layer, pins = {}, fitted = false;

function km(a, b) {
  const r = Math.PI / 180, dl = (b.lat - a.lat) * r, dn = (b.lon - a.lon) * r;
  const h = Math.sin(dl / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dn / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}
const price = s => { const v = s.g && s.g[fuel + "_prix"]; return v == null ? null : Number(v); };
const fmt = p => p.toFixed(3).replace(".", ",") + " €";
function age(s) {
  const d = s.g && s.g[fuel + "_maj"];
  if (!d) return "";
  const h = (Date.now() - new Date(d)) / 36e5;
  return "Prix mis à jour il y a " + (h < 48 ? Math.max(1, Math.round(h)) + " h" : Math.round(h / 24) + " jours");
}
const status = m => { $("#status").textContent = m; $("#status").style.display = m ? "block" : "none"; };

function renderChips() {
  $("#chips").innerHTML = FUELS.map(([k, n]) =>
    `<button class="chip" data-k="${k}" aria-pressed="${k === fuel}">${n}</button>`).join("");
}
$("#chips").addEventListener("click", e => {
  const k = e.target.dataset.k;
  if (!k) return;
  fuel = k;
  try { localStorage.setItem("fuel", k); } catch (e) {}
  renderChips();
  sel = null;
  render();
});

async function fetchOsm() {
  const R = 25000, a = `(around:${R},${me.lat},${me.lon})`;
  const q = `[out:json][timeout:25];(nwr["amenity"="fuel"]["brand"~"Total",i]${a};nwr["amenity"="fuel"]["name"~"Total",i]${a};);out center tags;`;
  const r = await fetch("https://overpass-api.de/api/interpreter", { method: "POST", body: "data=" + encodeURIComponent(q) });
  if (!r.ok) throw new Error("Overpass " + r.status);
  const out = [];
  for (const el of (await r.json()).elements) {
    const p = { lat: el.lat ?? el.center?.lat, lon: el.lon ?? el.center?.lon };
    if (p.lat == null) continue;
    p.d = km(me, p);
    if (out.some(o => km(o, p) < 0.06)) continue;
    p.name = el.tags.name || "TotalEnergies";
    p.addr = [el.tags["addr:housenumber"], el.tags["addr:street"], el.tags["addr:city"]].filter(Boolean).join(" ");
    p.id = el.type + el.id;
    out.push(p);
  }
  return out.sort((a, b) => a.d - b.d).slice(0, 10);
}

async function fetchGov(list) {
  const where = list.map(s => `within_distance(geom, geom'POINT(${s.lon} ${s.lat})', 150m)`).join(" OR ");
  const u = new URL(GOV);
  u.searchParams.set("where", where);
  u.searchParams.set("limit", "100");
  const r = await fetch(u);
  if (!r.ok) throw new Error("Prix " + r.status);
  return (await r.json()).results || [];
}

async function start() {
  renderChips();
  map = L.map("map", { zoomControl: false }).setView([46.6, 2.5], 6);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
  layer = L.layerGroup().addTo(map);
  status("Localisation en cours…");
  try {
    const p = await new Promise((ok, ko) => navigator.geolocation.getCurrentPosition(ok, ko, { enableHighAccuracy: true, timeout: 15000 }));
    me = { lat: p.coords.latitude, lon: p.coords.longitude };
  } catch (e) {
    status("Position indisponible. Autorise la localisation pour Safari dans Réglages > Confidentialité, puis recharge la page.");
    return;
  }
  L.circleMarker([me.lat, me.lon], { radius: 8, color: "#fff", weight: 3, fillColor: "#2563eb", fillOpacity: 1 }).addTo(map);
  map.setView([me.lat, me.lon], 12);
  try {
    status("Recherche des stations TotalEnergies…");
    stations = await fetchOsm();
    if (!stations.length) { status("Aucune station TotalEnergies trouvée dans un rayon de 25 km."); return; }
    status("Chargement des prix…");
    const gov = await fetchGov(stations);
    for (const s of stations) {
      let best = null, bd = 0.15;
      for (const g of gov) {
        if (!g.geom) continue;
        const d = km(s, { lat: g.geom.lat, lon: g.geom.lon });
        if (d < bd) { bd = d; best = g; }
      }
      s.g = best;
      if (best && best.adresse) s.addr = best.adresse + ", " + (best.cp || "") + " " + (best.ville || "");
    }
    status("");
    render();
  } catch (e) {
    status("Chargement impossible (" + e.message + "). Vérifie ta connexion et recharge la page.");
  }
}

function render() {
  if (!stations.length) return;
  const withP = stations.filter(s => price(s) != null).sort((a, b) => price(a) - price(b));
  const noP = stations.filter(s => price(s) == null);
  ordered = [...withP, ...noP];
  const best = withP[0] || null;
  if (!sel) sel = (best || ordered[0]).id;

  layer.clearLayers();
  pins = {};
  for (const s of ordered) {
    const p = price(s);
    const m = L.marker([s.lat, s.lon], {
      icon: L.divIcon({ className: "", iconSize: [64, 24], iconAnchor: [32, 12],
        html: `<div class="pin${s === best ? " best" : ""}" data-id="${s.id}">${p != null ? p.toFixed(3).replace(".", ",") : "n.d."}</div>` })
    }).addTo(layer);
    m.on("click", () => select(s.id));
    pins[s.id] = m;
  }

  $("#list").innerHTML = ordered.map(s => {
    const p = price(s);
    return `<button class="row${s === best ? " best" : ""}" data-id="${s.id}">
      <div class="price">${p != null ? fmt(p) : "n.d."}</div>
      <div class="who">${esc(s.name)}<span>${esc(s.addr)}</span></div>
      <div class="km">${s.d.toFixed(1).replace(".", ",")} km</div></button>`;
  }).join("");

  if (!fitted) {
    map.fitBounds(L.latLngBounds([[me.lat, me.lon], ...stations.map(s => [s.lat, s.lon])]).pad(0.15));
    fitted = true;
  }
  select(sel, false);
}
$("#list").addEventListener("click", e => {
  const r = e.target.closest(".row");
  if (r) select(r.dataset.id);
});

function select(id, pan = true) {
  sel = id;
  const s = stations.find(x => x.id === id);
  if (!s) return;
  const best = ordered.find(x => price(x) != null);
  document.querySelectorAll(".pin").forEach(p => p.classList.toggle("sel", p.dataset.id === id));
  document.querySelectorAll(".row").forEach(r => r.toggleAttribute("aria-current", r.dataset.id === id));
  if (pan) map.panTo([s.lat, s.lon]);
  const p = price(s);
  $("#detail").innerHTML = `<h2>${esc(s.name)}</h2>
    <p>${esc(s.addr)}</p>
    <p>À ${s.d.toFixed(1).replace(".", ",")} km de toi</p>
    ${p != null
      ? `<p class="big">${fmt(p)}/L</p>${s === best ? '<p class="tag">La moins chère des ' + stations.length + "</p>" : ""}<p>${age(s)}</p>`
      : "<p>Prix non disponible pour ce carburant.</p>"}
    <div class="go">
      <a class="btn" href="https://maps.apple.com/?daddr=${s.lat},${s.lon}&dirflg=d">Lancer l’itinéraire</a>
      <a class="btn alt" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}&travelmode=driving">Google Maps</a>
    </div>`;
}

start();
</script>
</body>
</html>
